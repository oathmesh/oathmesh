name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOTOOLCHAIN: auto

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

      - name: go test -fuzz
        run: |
          go test -fuzz=FuzzParseToken -fuzztime=30s ./internal/sign
          go test -fuzz=FuzzParseHeader -fuzztime=30s ./internal/sign
        continue-on-error: true

      - name: go build
        run: CGO_ENABLED=0 go build -o bin/oathmesh ./cmd/oathmesh

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: oathmesh-linux-amd64
          path: bin/oathmesh

  vulnscan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  node-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install
        run: npm install

      - name: Build (tsc)
        run: npx tsc

      - name: Test
        run: npx vitest run

  python-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e .[test]

      - name: Test
        run: pytest tests/

  conformance:
    needs: [build, node-sdk, python-sdk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build Go CLI
        run: CGO_ENABLED=0 go build -o bin/oathmesh ./cmd/oathmesh

      - name: Generate test key
        run: |
          openssl genpkey -algorithm Ed25519 -out private.pem
          chmod 644 private.pem

      - name: Start Docker services
        run: docker compose up -d --build issuer chi-api express-api fastapi-api redis || (docker compose logs issuer && exit 1)

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/healthz && break || sleep 2
          done
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081/healthz && break || sleep 2
          done
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/healthz && break || sleep 2
          done
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/healthz && break || sleep 2
          done

      - name: Run conformance tests
        run: make conformance
        env:
          OATHMESH_ISSUER: http://localhost:4000

      - name: Upload results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: conformance-results
          path: conformance/results_*.json

      - name: Cleanup
        if: always()
        run: docker compose down
