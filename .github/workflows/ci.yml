name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOTOOLCHAIN: auto

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

      - name: go test -fuzz
        run: |
          go test -fuzz=FuzzParseToken -fuzztime=30s ./internal/sign
          go test -fuzz=FuzzParseHeader -fuzztime=30s ./internal/sign
        continue-on-error: true

      - name: go build
        run: CGO_ENABLED=0 go build -o bin/oathmesh ./cmd/oathmesh

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: oathmesh-linux-amd64
          path: bin/oathmesh

  vulnscan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  node-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install
        run: npm install

      - name: Build (tsc)
        run: npx tsc

      - name: Test
        run: npx vitest run

  python-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e .[test]

      - name: Test
        run: pytest tests/

  conformance:
    needs: [build, node-sdk, python-sdk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Node SDK deps
        run: npm install
        working-directory: sdk/node

      - name: Install Python SDK deps
        run: pip install -e .[test]
        working-directory: sdk/python

      - name: Run conformance tests
        run: make conformance

      - name: Upload results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: conformance-results
          path: tests/conformance/results/conformance_matrix.json
