[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oathmesh"
version = "1.0.0"
description = "OathMesh verification SDK for Python"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pyjwt[crypto] >= 2.8.0",
    "cryptography >= 41.0.0"
]

[project.optional-dependencies]
test = [
    "pytest >= 7.0.0",
    "fastapi >= 0.100.0",
    "httpx >= 0.25.0"
]
