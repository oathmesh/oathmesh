services:
  # ── Infrastructure ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  # ── OathMesh Issuer ────────────────────────────────────────────────────────
  issuer:
    build:
      context: .
      dockerfile: Dockerfile.issuer
    ports:
      - "4000:4000"
    environment:
      OATHMESH_ISSUER: http://issuer:4000
      OATHMESH_PRIVATE_KEY_FILE: /run/secrets/private_key
      OATHMESH_AUDIT_SINK: stdout
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    secrets:
      - private_key

  # ── OathMesh Gateway ───────────────────────────────────────────────────────
  # Separate images limit attack surface per container.
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "4001:4000"
    environment:
      OATHMESH_GATEWAY_UPSTREAM: http://upstream-demo:80
      OATHMESH_GATEWAY_AUDIENCE: https://inventory.internal
      OATHMESH_GATEWAY_ISSUERS: http://issuer:4000
      OATHMESH_GATEWAY_POLICY: /policy/production.json
    volumes:
      - ./policy/production.json:/policy/production.json:ro
    depends_on:
      issuer:
        condition: service_healthy

  # ── Upstream Demo (receives proxied requests) ──────────────────────────────
  upstream-demo:
    image: traefik/whoami
    ports:
      - "8080:80"

  # ── Go chi-api Example ─────────────────────────────────────────────────────
  chi-api:
    build:
      context: .
      dockerfile: examples/chi-api/Dockerfile
    ports:
      - "8081:8080"
    environment:
      OATHMESH_AUDIENCE: https://inventory.internal
      OATHMESH_TRUSTED_ISSUERS: http://issuer:4000
    depends_on:
      issuer:
        condition: service_healthy

  # ── Express API Example ───────────────────────────────────────────────────
  express-api:
    build:
      context: .
      dockerfile: examples/express-api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      OATHMESH_AUDIENCE: https://inventory.internal
      OATHMESH_TRUSTED_ISSUERS: http://issuer:4000
    depends_on:
      issuer:
        condition: service_healthy

  # ── FastAPI API Example ───────────────────────────────────────────────────
  fastapi-api:
    build:
      context: .
      dockerfile: examples/fastapi-api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      OATHMESH_AUDIENCE: https://inventory.internal
      OATHMESH_TRUSTED_ISSUERS: http://issuer:4000
    depends_on:
      issuer:
        condition: service_healthy

secrets:
  private_key:
    file: ./private.pem

volumes:
  redis_data:
