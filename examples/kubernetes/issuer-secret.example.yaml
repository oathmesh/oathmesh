apiVersion: v1
kind: Secret
metadata:
  name: oathmesh-issuer-secrets
  namespace: oathmesh
  labels:
    app.kubernetes.io/name: oathmesh
    app.kubernetes.io/component: issuer
type: Opaque
stringData:
  OATHMESH_MINT_SECRET: "<replace-with-strong-random-secret>"
  OATHMESH_PRIVATE_KEY: |
    -----BEGIN PRIVATE KEY-----
    <replace-with-ed25519-private-key-pem>
    -----END PRIVATE KEY-----

