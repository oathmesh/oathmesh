apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oathmesh-issuer
  namespace: oathmesh
  labels:
    app.kubernetes.io/name: oathmesh
    app.kubernetes.io/component: issuer
spec:
  serviceName: oathmesh-issuer
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oathmesh
      app.kubernetes.io/component: issuer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oathmesh
        app.kubernetes.io/component: issuer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: issuer
          image: oathmesh/oathmesh:latest
          imagePullPolicy: IfNotPresent
          args: ["serve", "--port", "4000"]
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - configMapRef:
                name: oathmesh-issuer-config
            - secretRef:
                name: oathmesh-issuer-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

