apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oathmesh-default-deny
  namespace: oathmesh
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oathmesh-issuer-policy
  namespace: oathmesh
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oathmesh
      app.kubernetes.io/component: issuer
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oathmesh
              app.kubernetes.io/component: receiver
      ports:
        - protocol: TCP
          port: 4000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 4000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oathmesh
              app.kubernetes.io/component: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oathmesh-redis-policy
  namespace: oathmesh
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oathmesh
      app.kubernetes.io/component: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oathmesh
              app.kubernetes.io/component: issuer
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oathmesh-receiver-policy
  namespace: oathmesh
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oathmesh
      app.kubernetes.io/component: receiver
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oathmesh
              app.kubernetes.io/component: issuer
      ports:
        - protocol: TCP
          port: 4000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

