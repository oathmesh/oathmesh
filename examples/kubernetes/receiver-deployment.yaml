apiVersion: v1
kind: Service
metadata:
  name: oathmesh-receiver
  namespace: oathmesh
  labels:
    app.kubernetes.io/name: oathmesh
    app.kubernetes.io/component: receiver
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: oathmesh
    app.kubernetes.io/component: receiver
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oathmesh-receiver
  namespace: oathmesh
  labels:
    app.kubernetes.io/name: oathmesh
    app.kubernetes.io/component: receiver
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oathmesh
      app.kubernetes.io/component: receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oathmesh
        app.kubernetes.io/component: receiver
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: receiver
          image: ghcr.io/acme/oathmesh-receiver:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: OATHMESH_AUDIENCE
              value: https://inventory.internal
            - name: OATHMESH_TRUSTED_ISSUERS
              value: https://issuer.example.com
            - name: OATHMESH_JWKS_CACHE_TTL
              value: "60"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

